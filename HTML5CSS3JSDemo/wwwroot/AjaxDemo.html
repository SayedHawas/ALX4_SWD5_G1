<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <a class="btn btn-primary"> primary </a>
    <a class="btn btn-secondary"> secondary </a>
    <a class="btn btn-danger"> danger </a>
    <a class="btn btn-success"> success </a>
    <a class="btn btn-dark"> dark </a>
    <br>
    <button class="btn btn-primary"> Save </button>
    <br>
    <button id="btn">Send an HTTP GET request to a page https://fakestoreapi.com/ </button>
    <table id="Products" class="table table-hover table-striped">
        <tr>
            <th> Product ID</th>
            <th>Product Name </th>
            <th> Price </th>
        </tr>
    </table>
    <br>
    <hr>
    <input type="number" id="idNumber">
    <button id="btn1"> Get By Ajax </button>
    <p id="Product-temp"></p>
                         <div class="card" style="width:400px">
                            <img id="imgProduct" class="card-img-top" src="" alt="Card image">
                            <div class="card-body">
                                <h4 id="title" class="card-title"></h4>
                                <p id="decs" class="card-text">.</p>
                                <a id="price" href="#"  class="btn btn-primary">  </a>
                            </div>
                         </div>
    <!-- <form action="" method="get">

    </form> -->


    <script>
        $(document).ready(function () {

            $("#btn").click(function () {
                $.get("https://fakestoreapi.com/products", function (data, status) {
                    // alert("Data: " + data + "\nStatus: " + status);
                    //console.log(status);
                    //console.log(data);
                    for (var item in data) {
                        //console.log("ID :" +  data[i].id + " Name : " + data[i].title + " Price : " + data[i].price  );
                        // var newRow  =  document.createElement('tr');
                        // document.getElementById("Products").appendChild(newRow);
                        // var idtext =  document.createElement('td');
                        // idtext.textContent = data[item].id ;
                        // document.getElementById("Products").appendChild(idtext);
                        // var titletext =  document.createElement('td');
                        // titletext.textContent = data[item].title ;
                        // document.getElementById("Products").appendChild(titletext);
                        // var pricetext =  document.createElement('td');
                        // pricetext.textContent = data[item].price ;
                        // document.getElementById("Products").appendChild(pricetext);

                        var newRow = $('<tr>');
                        $('<td>').text(data[item].id).appendTo(newRow);
                        $('<td>').text(data[item].title).appendTo(newRow);
                        $('<td>').text(data[item].price + "$").appendTo(newRow);
                        $('#Products').append(newRow);
                    }
                });
            });

            $("#btn1").click(function () {
                var id = $("#idNumber").val();
                $.ajax({
                    url: "https://fakestoreapi.com/products/" + id,
                    success: function (result) {
                        if (result.id != undefined )
                        {
                            $("#Product-temp").html("<strong>" + result.id + "Name : " + result.title + " Price : " + result.price + "$ </strong> ");
                            $("#title").html(result.title);
                            $("#decs").html(result.description);
                            $('#imgProduct').attr('src',result.image);
                           $('#price').text(result.price + " $ ")
                        }
                            else
                            $("#Product-temp").html("<strong> Not Found ....</strong> ");
                    }
                });

            });


        });
    </script>

</body>
</html>
